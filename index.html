<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ в строительстве — программа курса</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#ffffff; --card:#faf8f5; --card2:#f3efe9; --ink:#1a1814; --muted:#6f7280;
    --line:#e9e4dc; --brand:#e2231a; --blue:#237cf9; --green:#1f9d57; --yellow:#f5b500; --purple:#9b5de5;
    --r:16px; --rs:10px; --font:'Proxima Nova','Helvetica Neue','Segoe UI',Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 70px}
  a{color:var(--blue);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
  .logo{font-weight:800;font-size:15px}.logo .red{color:var(--brand)}.logo .sep{color:var(--muted);font-weight:600}
  .school{font-size:13px;color:var(--muted);font-weight:600}.topbar .sp{flex:1}
  .pill{display:inline-block;background:#efe7fb;color:var(--purple);border:1px solid #ddc9f6;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
  .kicker{font-size:12.5px;letter-spacing:.04em;color:var(--muted);font-weight:700;margin:0 0 8px;text-transform:uppercase}
  .rule{display:inline-block;width:46px;height:4px;border-radius:3px;vertical-align:middle}
  h1{font-size:30px;line-height:1.1;margin:6px 0 4px;font-weight:800;letter-spacing:-.01em}
  .slogan{font-size:15.5px;font-weight:700;margin:0 0 18px}
  /* layout */
  .layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
  /* sidebar menu */
  .menu{position:sticky;top:14px;display:flex;flex-direction:column;gap:6px}
  .mtitle{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:4px 0 6px 4px}
  .mitem{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 13px;transition:.13s;display:flex;gap:11px;align-items:center}
  .mitem:hover{border-color:var(--ink)}
  .mitem.on{border-color:var(--ink);background:var(--card)}
  .mitem .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:0 0 auto}
  .mitem.on .bar{background:var(--blue)}
  .mitem .tx{flex:1;min-width:0}
  .mitem .lbl{font-size:14px;font-weight:700}
  .mitem .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto;title:proto}
  .dot.hidden{visibility:hidden}
  /* content */
  .content{min-height:300px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 11px}
  .badge.ready{background:#e7f6ee;color:#157a41;border:1px solid #bfe6cf}
  .badge.soon{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
  .badge .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
  h2{font-size:24px;margin:10px 0 2px;font-weight:800;letter-spacing:-.01em}
  .csub{color:var(--muted);font-size:14.5px;margin:0 0 14px}
  .promise{background:var(--card);border-left:4px solid var(--brand);border-radius:10px;padding:12px 15px;font-size:15px;font-weight:600;margin:14px 0}
  .lbl2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;margin:18px 0 6px}
  .inside{list-style:none;padding:0;margin:0}
  .inside li{padding:7px 0 7px 24px;position:relative;font-size:14px;border-bottom:1px solid var(--line)}
  .inside li:last-child{border-bottom:none}
  .inside li:before{content:"→";position:absolute;left:0;color:var(--blue);font-weight:800}
  .result{background:#eef8f1;border:1px solid #cdebd8;border-radius:10px;padding:13px 15px;font-size:14.5px;margin-top:8px}
  .result b{color:#157a41}
  .hook{font-size:14px;color:var(--ink);margin-top:12px}.hook .h{color:var(--brand);font-weight:800}
  /* steps */
  .steps{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .stp{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
  .stp.has{background:var(--card)}
  .stp .num{width:26px;height:26px;border-radius:7px;background:var(--card2);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
  .stp.has .num{background:var(--green);color:#fff}
  .stp .t{flex:1;font-size:13.5px}
  .stp a.open{font-size:12.5px;font-weight:700;background:var(--blue);color:#fff;border-radius:8px;padding:6px 12px;white-space:nowrap}
  .stp a.open:hover{filter:brightness(.95)}
  .stp .ptag{font-size:11px;font-weight:800;color:#157a41}
  .protos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
  .pcard{border:1px solid #bfe6cf;background:#f4fbf6;border-radius:12px;padding:14px 16px}
  .pcard .pt{font-weight:800;font-size:14.5px;margin-bottom:3px}
  .pcard .pn{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .pcard a{display:inline-block;font-size:13px;font-weight:700;background:var(--ink);color:#fff;border-radius:9px;padding:8px 14px}
  .foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}.menu{position:static;flex-direction:column}.protos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="logo"><span class="red">АКТИОН</span> <span class="sep">Строительство</span></span>
    <span class="school">· Высшая инженерная школа</span>
    <span class="sp"></span>
    <span class="pill">Программа курса</span>
  </div>

  <div class="kicker">Онлайн-курс <span class="rule" style="background:var(--brand)"></span></div>
  <h1>ИИ в строительстве</h1>
  <p class="slogan">30 шагов: рабочий ИИ-инструмент для строителя</p>

  <div class="layout">
    <nav class="menu" id="menu"></nav>
    <main class="content card" id="content"></main>
  </div>

  <div class="foot">Курс «ИИ в строительстве» · Высшая инженерная школа (Актион Строительство)</div>
</div>

<script>
const DATA=[
  {id:'about', lbl:'О курсе', sub:'с чего начать', about:true,
   intro:`<p>ИИ уже не игрушка — это рабочий инструмент, который убирает рутину инженера: письма и акты, ответы на предписания, протоколы планёрок, сравнение смет, записи в журнал. Курс учит не «кнопкам одного сервиса», а способу мышления: какой инструмент взять под задачу, как им управлять и где его нельзя слепо слушать.</p>
   <p>За 30 коротких шагов (15–20 минут каждый, в своём темпе) вы пройдёте путь от «ни разу не пробовал» до собственного рабочего ИИ-набора под вашу роль — с разбором заданий куратором и удостоверением о повышении квалификации.</p>`,
   facts:['Для кого: ПТО, стройконтроль и технадзор, ГИП и проектировщики, сметчики и снабжение, прорабы и начальники участков, инженеры по охране труда.',
          'Чем зацепит: пользу видно с первой недели — на ваших же задачах.',
          'Чем отличается: примеры под вашу роль, инструменты доступные в России без VPN, и сквозной тренажёр «ваш ИИ-ассистент», который растёт вместе с вами.']},

  {id:'start', lbl:'Старт', sub:'Подготовь инструмент',
   promise:'За 15 минут у вас есть рабочий ИИ и понимание, что ему можно доверить.',
   aboutTxt:'Многие застревают на пороге — «а что вообще открыть?». Этот шаг снимает барьер: выбираем и регистрируем инструмент, делаем первый запрос и разбираем главное правило безопасности.',
   inside:['Выбор и регистрация инструмента (GigaChat / YandexGPT) за 10 минут','Правило «трёх нельзя»: персональные данные, коммерческая тайна, политика работодателя','Бесплатное против платного — чего хватит на курс'],
   result:'Вы готовы к практике и не боитесь «слить лишнее». Ассистент — Уровень 0.',
   steps:[{n:0,t:'Подготовь инструмент: выбор, регистрация, первый запрос, безопасность данных'}]},

  {id:'w1', lbl:'Неделя 1', sub:'Основы и первый результат',
   promise:'К концу недели вы получаете от ИИ полезный ответ с первого раза, а не «воду».',
   aboutTxt:'Разбираемся, как ИИ «думает» (и почему уверенно ошибается), учимся давать ему роль и контекст и сразу проверять результат. Каждый день заканчивается применением на своей задаче.',
   inside:['Как ИИ предсказывает текст','Где он врёт и как это ловить','Безопасность данных','Формула сильного запроса: роль + контекст + задача + формат','Почему ИИ «глупеет» без ваших документов','Что делать, когда ИИ отказывает или ошибается'],
   result:'Вы пишете рабочее письмо или записку за минуты и отличаете надёжный ответ от выдумки. Ассистент — Уровень 1.',
   hook:'То, на что уходил час, начинает занимать пять минут — уже на первой неделе.',
   steps:[
     {n:1,t:'Как ИИ «думает» — и почему уверенно ошибается',url:'module-0.html'},
     {n:2,t:'Где ИИ врёт и как это проверять',url:'module-0.html'},
     {n:3,t:'Что нельзя загружать: данные, тайна, политика работодателя',url:'module-0.html'},
     {n:4,t:'Формула сильного запроса: роль + контекст + задача + формат'},
     {n:5,t:'Почему ИИ не знает вашу компанию — и как это исправить',url:'lesson-1.html'},
     {n:6,t:'Что делать, когда ИИ отказывает или ошибается'},
     {n:7,t:'Практикум: ваше первое рабочее письмо с ИИ'}],
   protos:[{pt:'Модуль 0 · Знакомство с ИИ',pn:'Тренажёры шагов 1–3: как ИИ думает, где врёт, что нельзя загружать',url:'module-0.html'},
           {pt:'Урок: ИИ не знает вашу компанию',pn:'Шаг 5 — тренажёр «без / с документами», практика и отправка на проверку',url:'lesson-1.html'}]},

  {id:'w2', lbl:'Неделя 2', sub:'Документы в работе',
   promise:'ИИ становится вашим «черновиком по умолчанию» для любого рабочего документа.',
   aboutTxt:'Самая отдачливая неделя: ИИ начинает реально снимать бумажную нагрузку — ответы на предписания и замечания, инструкции, длинные договоры, отчёты. И вы заводите личную библиотеку промптов, которая работает весь курс и после него.',
   inside:['Устойчивый шаблон запроса','Обучаем ИИ своему стилю на примерах','Рабочие документы под роль: письма, ответы на предписания/замечания, инструкции по ОТ','Выжимка из длинного договора: сроки, штрафы, риски','Структура и слайды для отчёта руководству','Личная библиотека шаблонов под роль'],
   result:'Готовые документы собираются по вашим шаблонам в один-два запроса, а разбор 40-страничного договора — за минуты. Ассистент — Уровень 2.',
   hook:'Один раз настроили шаблон ответа на предписание — и дальше он экономит часы каждую неделю.',
   steps:[
     {n:8,t:'Пять кирпичей надёжного промпта'},{n:9,t:'Учим ИИ своему стилю на примерах'},
     {n:10,t:'Рабочие документы под роль: письма, предписания, инструкции'},
     {n:11,t:'Длинный договор за минуты: сроки, штрафы, риски'},
     {n:12,t:'Презентации и отчёты для руководства'},
     {n:13,t:'Личная библиотека шаблонов под вашу роль'},
     {n:14,t:'Практикум: собрать готовый документ от и до'}]},

  {id:'w3', lbl:'Неделя 3', sub:'Данные и медиа на стройке',
   promise:'ИИ выходит за пределы текста — в таблицы, сканы, голос, фото и видео с объекта.',
   aboutTxt:'Прикладная неделя под реальную стройку: Excel без знания формул, распознавание сканов, диктовка записей голосом, автопротоколы совещаний, фото и видео для отчётов. К каждому медиа-инструменту — короткая инструкция по настройке.',
   inside:['Формулы и сводки в Excel простыми словами','Сравнение смет и КП в таблицу с подсветкой отклонений','Распознавание актов и спецификаций (OCR)','Голос → запись в ОЖР и предписания','Планёрка → протокол с поручениями','Фото с объекта для отчётов','Субтитры и краткое содержание видеообхода'],
   result:'Вы сводите пять КП в таблицу за минуту, надиктовываете запись в журнал и получаете протокол совещания «из коробки». Ассистент — Уровень 3.',
   hook:'Самую нелюбимую рутину — журналы, протоколы, сравнение предложений — теперь делает ассистент, а вы проверяете.',
   steps:[
     {n:15,t:'Excel простыми словами: формулы и сводки'},
     {n:16,t:'Сравнение смет и КП в таблицу с подсветкой рисков',url:'lesson-kp.html'},
     {n:17,t:'Распознавание сканов: акты и спецификации (OCR)'},
     {n:18,t:'Голос → запись в ОЖР и предписания',url:'lesson-ozhr.html'},
     {n:19,t:'Планёрка → протокол с поручениями'},
     {n:20,t:'Фото с объекта для отчётов'},
     {n:21,t:'Видеообход: субтитры и краткое содержание'}],
   protos:[{pt:'Урок: Сравнение КП в таблицу',pn:'Шаг 16 — тренажёр сведения предложений и подсветки рисков (сметчик)',url:'lesson-kp.html'},
           {pt:'Урок: Голос → запись в ОЖР',pn:'Шаг 18 — диктовка смены превращается в запись журнала (прораб)',url:'lesson-ozhr.html'}]},

  {id:'w4', lbl:'Неделя 4', sub:'Знания и устойчивая практика',
   promise:'ИИ перестаёт быть разовым помощником и встраивается в вашу рабочую неделю.',
   aboutTxt:'Учим ассистента отвечать по вашим документам и нормативам со ссылкой на источник и превращаем разрозненные приёмы в устойчивую привычку. Здесь же честный обзор «горизонта»: что такое инструменты и агенты и когда они понадобятся.',
   inside:['Вопрос-ответ по своим документам (загрузил — спросил)','Нормативка с обязательной проверкой первоисточника','Расширение библиотеки шаблонов под все задачи роли','Встраивание ИИ в недельную рутину','Как не отстать от новых инструментов','Обзор инструментов и агентов как следующего уровня','Сборка персонального ИИ-набора'],
   result:'У вас есть личный рабочий набор — инструменты, шаблоны и правила безопасности — которым вы пользуетесь каждый день. Ассистент — рабочий набор собран.',
   hook:'Не «прошёл курс и забыл», а реально работающая привычка, которая остаётся с вами.',
   steps:[
     {n:22,t:'Вопрос-ответ по своим документам со ссылкой'},{n:23,t:'Нормативка с обязательной проверкой'},
     {n:24,t:'Расширяем библиотеку шаблонов'},{n:25,t:'Встраиваем ИИ в недельную рутину'},
     {n:26,t:'Как не отстать от новых инструментов'},{n:27,t:'Горизонт: инструменты и агенты — когда понадобятся'},
     {n:28,t:'Ваш персональный ИИ-набор'}]},

  {id:'final', lbl:'Финал', sub:'Защита и «Паспорт навыков»',
   promise:'Вы доказываете навык на своей реальной задаче — и получаете официальный документ.',
   aboutTxt:'Собираем всё на сквозном кейсе вашей роли (ПТО — пакет документов по этапу; стройконтроль — неделя предписаний и фотоотчёт; сметчик — сравнение КП и письмо), отправляем куратору и получаем обратную связь.',
   inside:['Итоговый сквозной кейс по роли','Защита и проверка куратором','Отметка в «Паспорте навыков»','Удостоверение о повышении квалификации установленного образца'],
   result:'Подтверждённый навык в портфолио и документ, который повышает вашу ценность на рынке.',
   hook:'На выходе — не сертификат «о прослушивании», а доказанное умение применять ИИ в своей работе.',
   steps:[{n:29,t:'Итоговый сквозной кейс по вашей роли'},{n:30,t:'Защита, проверка куратором, «Паспорт навыков» и удостоверение'}]}
];

const menu=document.getElementById('menu');
const content=document.getElementById('content');

function hasProto(s){return (s.steps&&s.steps.some(x=>x.url))||(s.protos&&s.protos.length);}

// build menu
const head=document.createElement('div');head.className='mtitle';head.textContent='Разделы курса';menu.appendChild(head);
DATA.forEach(s=>{
  const it=document.createElement('div');it.className='mitem';it.dataset.id=s.id;
  const proto=hasProto(s);
  it.innerHTML=`<span class="bar"></span><span class="tx"><span class="lbl">${s.lbl}</span><span class="sub">${s.sub}</span></span><span class="dot ${proto?'':'hidden'}" title="есть прототип"></span>`;
  it.addEventListener('click',()=>select(s.id));
  menu.appendChild(it);
});

function select(id){
  document.querySelectorAll('.mitem').forEach(m=>m.classList.toggle('on',m.dataset.id===id));
  const s=DATA.find(x=>x.id===id);
  content.innerHTML=render(s);
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(s){
  if(s.about){
    return `<div class="badge ready" style="visibility:hidden"></div><h2>О курсе</h2>
      ${s.intro}
      <div class="lbl2">Коротко</div>
      <ul class="inside">${s.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
      <div class="result" style="margin-top:18px"><b>Как устроено:</b> сквозной ассистент растёт по неделям (голый чат → роль и контекст → библиотека промптов → знания и медиа → рабочий набор), а агенты — честный горизонт «следующего уровня». Выберите раздел слева, чтобы увидеть, что внутри.</div>`;
  }
  const proto=hasProto(s);
  const badge=proto?`<span class="badge ready"><span class="d"></span> Есть прототип</span>`:`<span class="badge soon">В разработке</span>`;
  let html=`${badge}<h2>${s.lbl}. ${s.sub}</h2>`;
  if(s.promise)html+=`<div class="promise">${s.promise}</div>`;
  if(s.aboutTxt)html+=`<p class="csub">${s.aboutTxt}</p>`;
  if(s.inside){html+=`<div class="lbl2">Что внутри</div><ul class="inside">${s.inside.map(i=>`<li>${i}</li>`).join('')}</ul>`;}
  if(s.result)html+=`<div class="result" style="margin-top:14px">${s.result}</div>`;
  if(s.hook)html+=`<p class="hook"><span class="h">Зачем:</span> ${s.hook}</p>`;
  if(s.protos&&s.protos.length){
    html+=`<div class="lbl2">Готовые прототипы — можно открыть и пройти</div><div class="protos">`+
      s.protos.map(p=>`<div class="pcard"><div class="pt">${p.pt}</div><div class="pn">${p.pn}</div><a href="${p.url}">Открыть урок →</a></div>`).join('')+`</div>`;
  }
  if(s.steps){
    html+=`<div class="lbl2">Шаги раздела</div><div class="steps">`+
      s.steps.map(st=>`<div class="stp ${st.url?'has':''}"><span class="num">${st.n}</span><span class="t">${st.t}</span>`+
        (st.url?`<span class="ptag">прототип</span> <a class="open" href="${st.url}">Открыть</a>`:'')+`</div>`).join('')+`</div>`;
  }
  return html;
}

select('about');
</script>
</body>
</html>
